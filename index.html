<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Master Pro - Học Từ Vựng Thông Minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1' },
                        accent: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Hiệu ứng xoay 3D cho Flashcard */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <!-- Logo -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('study')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary-500 to-accent-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-primary-500/30">
                    ⚡
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-primary-600 to-accent-600 dark:from-primary-400 dark:to-accent-400 bg-clip-text text-transparent">
                        Flashcard Pro
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Ghi nhớ từ vựng siêu tốc</p>
                </div>
            </div>

            <!-- Stats & Navigation -->
            <div class="flex items-center gap-2 sm:gap-4">
                <!-- Streak -->
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 font-semibold text-sm" title="Chuỗi ngày học">
                    <span>🔥</span>
                    <span id="streak-count">0</span>
                    <span class="hidden sm:inline text-xs">ngày</span>
                </div>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                    <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
                </button>

                <!-- Sound Toggle -->
                <button onclick="toggleSound()" class="p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors" title="Bật/Tắt âm thanh">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-6">

        <!-- Top Controls: Deck Selector & Navigation Tabs -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 bg-white dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/60 shadow-sm">
            <!-- Deck Select -->
            <div class="flex items-center gap-3 flex-1 min-w-[200px]">
                <i class="fa-solid fa-layer-group text-primary-500 text-xl"></i>
                <select id="deck-select" onchange="changeDeck(this.value)" class="w-full bg-slate-100 dark:bg-slate-700/70 border-0 text-slate-800 dark:text-slate-100 font-semibold rounded-xl px-3 py-2 focus:ring-2 focus:ring-primary-500 cursor-pointer">
                    <!-- Populated dynamically -->
                </select>
                <button onclick="openNewDeckModal()" class="p-2 bg-primary-500 hover:bg-primary-600 text-white rounded-xl transition-all shadow-md shadow-primary-500/20" title="Tạo bộ thẻ mới">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Tabs -->
            <div class="flex bg-slate-100 dark:bg-slate-900/60 p-1 rounded-xl gap-1">
                <button id="tab-study-btn" onclick="switchTab('study')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-white dark:bg-slate-800 text-primary-600 dark:text-primary-400 shadow-sm">
                    <i class="fa-solid fa-clone mr-1.5"></i>Học thẻ
                </button>
                <button id="tab-quiz-btn" onclick="switchTab('quiz')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-brain mr-1.5"></i>Trắc nghiệm
                </button>
                <button id="tab-manage-btn" onclick="switchTab('manage')" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    <i class="fa-solid fa-list-check mr-1.5"></i>Quản lý
                </button>
            </div>
        </div>

        <!-- ================= TAB 1: STUDY MODE ================= -->
        <section id="tab-study" class="flex-1 flex flex-col items-center justify-center gap-6">
            <!-- Progress Bar -->
            <div class="w-full max-w-md flex flex-col gap-1.5">
                <div class="flex justify-between text-xs font-semibold text-slate-500 dark:text-slate-400">
                    <span>Tiến độ học</span>
                    <span id="progress-text">0 / 0</span>
                </div>
                <div class="w-full h-2.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-primary-500 to-accent-500 transition-all duration-300 w-0"></div>
                </div>
            </div>

            <!-- Flashcard 3D Wrapper -->
            <div class="w-full max-w-md h-80 perspective-1000 cursor-pointer group" onclick="flipCard()">
                <div id="flashcard" class="w-full h-full relative transform-style-3d transition-transform duration-500 rounded-3xl shadow-xl border border-slate-200/80 dark:border-slate-700/50">
                    
                    <!-- Front Face -->
                    <div class="absolute inset-0 w-full h-full backface-hidden bg-white dark:bg-slate-800 rounded-3xl p-6 flex flex-col justify-between items-center text-center">
                        <div class="w-full flex justify-between items-center text-xs font-bold text-slate-400">
                            <span class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-700/60 text-slate-500 dark:text-slate-400">MẶT TRƯỚC</span>
                            <button onclick="speakWord(event)" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-primary-500 transition-colors" title="Phát âm">
                                <i class="fa-solid fa-volume-high text-lg"></i>
                            </button>
                        </div>

                        <div class="my-auto px-4">
                            <h2 id="card-word" class="text-3xl sm:text-4xl font-extrabold text-slate-800 dark:text-slate-100 break-words">
                                Khởi tạo...
                            </h2>
                            <p id="card-hint" class="text-sm text-slate-400 mt-2 italic font-medium hidden"></p>
                        </div>

                        <div class="text-xs text-slate-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-hand-pointer animate-bounce"></i> Bấm để lật xem nghĩa
                        </div>
                    </div>

                    <!-- Back Face -->
                    <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-primary-600 to-accent-600 text-white rounded-3xl p-6 flex flex-col justify-between items-center text-center">
                        <div class="w-full flex justify-between items-center text-xs font-bold text-primary-100/70">
                            <span class="px-2.5 py-1 rounded-full bg-white/10 backdrop-blur-sm">MẶT SAU</span>
                            <button onclick="speakWord(event, true)" class="p-2 rounded-full hover:bg-white/10 text-white transition-colors" title="Phát âm">
                                <i class="fa-solid fa-volume-high text-lg"></i>
                            </button>
                        </div>

                        <div class="my-auto px-4">
                            <h3 id="card-meaning" class="text-2xl sm:text-3xl font-bold break-words">
                                Định nghĩa...
                            </h3>
                            <p id="card-example" class="text-sm text-primary-100/90 mt-3 italic bg-black/10 p-3 rounded-xl border border-white/10 hidden"></p>
                        </div>

                        <div class="text-xs text-primary-200 flex items-center gap-1.5">
                            <i class="fa-solid fa-rotate-left"></i> Bấm để quay lại mặt trước
                        </div>
                    </div>

                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-4 w-full max-w-md">
                <button onclick="markCard(false)" class="flex-1 py-3 px-4 rounded-2xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 font-bold flex items-center justify-center gap-2 border border-rose-500/20 transition-all active:scale-95">
                    <i class="fa-solid fa-xmark text-lg"></i> Chưa thuộc
                </button>
                <button onclick="markCard(true)" class="flex-1 py-3 px-4 rounded-2xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold flex items-center justify-center gap
